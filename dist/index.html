<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAV COLLAB · 飞行协作</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="cockpit.css"></head><body>
<div id="flightView"></div><div class="shade"></div><header class="topbar"><strong class="brand">UAV <em>COLLAB</em></strong><span id="flightStatus" class="status">● 待命</span><span class="top-mode">定位仿真 <b>GPS</b></span><span class="signals">▥ 链路模拟　◉ 19</span><span class="battery">▰ <b id="battery">82</b>%</span><button id="toggleMission" aria-expanded="true">目的地 ☷</button><a href="admin.html" target="_blank" rel="noopener" title="研究后台">⋯</a></header>
<div class="camera-strip"><span id="viewStatus">正在加载航空影像…</span><span>IRCHELPARK · ZÜRICH</span></div>
<section id="destinationPanel" class="glass destination"><div class="section-head"><span>飞往哪里</span><small>预设任务点</small></div><form id="destinationForm"><label class="sr-only" for="destinationInput">输入预设目的地</label><input id="destinationInput" list="destinationOptions" placeholder="输入或选择下方目的地" autocomplete="off"><datalist id="destinationOptions"></datalist><button class="primary" type="submit">规划路线 →</button></form><div id="destinationList"></div><p id="destinationMessage" role="status">选择目标后，由 AI 生成路线。</p></section>
<div class="reticle" aria-hidden="true">＋<small>AF</small></div><aside class="camera-tools"><label>云台<input id="pitch" type="range" min="20" max="85" value="38" aria-label="云台俯视角度"><output id="pitchValue">−38°</output></label><button id="capture" title="保存当前模拟视角截图" aria-label="保存视角截图">◎</button></aside>
<aside class="glass copilot"><div class="section-head"><span>✦ AI 飞行助手</span><button id="toggleAI" aria-expanded="true" aria-label="收起 AI 建议">−</button></div><div id="aiBody"><span id="eventBanner" class="eyebrow">等待目的地</span><h1 id="recTitle">下一站，由你决定</h1><p id="recSummary">选择任务点，查看建议航迹。</p><div id="decisionPanel" hidden><div class="decision-buttons"><button id="accept" class="primary">接受</button><button id="modify">修改</button><button id="reject">拒绝</button></div></div><div id="satCards"></div><div id="editor" hidden><label>路线策略<select id="strategy"><option value="recommended">推荐路线</option><option value="alternative">备选路线</option></select></label><div class="two-inputs"><label>高度 m<input id="editAlt" type="number" min="30" max="120" value="60"></label><label>速度 m/s<input id="editSpeed" type="number" min="2" max="12" value="8"></label></div><p class="muted">展开地图后，可拖动中间航点。</p><label>修改理由<input id="rationale" maxlength="160" placeholder="可选"></label><p id="validation" role="status"></p><div class="decision-buttons"><button id="applyEdit" class="primary">应用</button><button id="cancelEdit">取消</button></div></div><p id="missionHint" class="muted">模拟任务 · 无真实无人机连接</p></div></aside>
<section class="minimap" aria-label="航迹地图"><div class="map-heading"><span>◎ 航迹地图</span><button id="expandMap">展开 ↗</button></div><div class="map-wrap"><div id="geoMap"></div><svg id="map" viewBox="0 0 900 660" aria-label="任务航迹"><g id="hazards"></g><polyline id="originalRoute" fill="none" stroke="#eee" stroke-width="4" stroke-dasharray="8 8"/><polyline id="activeRoute" fill="none" stroke="#62ffbb" stroke-width="6"/><polyline id="suggestedRoute" fill="none" stroke="#ffd075" stroke-width="5" stroke-dasharray="8 8"/><g id="waypoints"></g><g id="drone"><circle r="21" fill="#102829" opacity=".7"/><path d="M0 -20 L13 14 0 8 -13 14Z" fill="#ff574c" stroke="white" stroke-width="2"/></g></svg><div class="map-tools"><button id="fitMap" aria-label="定位任务区">◎</button><select id="baseLayer" aria-label="地图底图"><option value="imagery">影像</option><option value="street">街道</option></select></div><div id="mapLoadStatus" role="status"></div></div></section>
<footer><div class="telemetry"><div><small>距目标</small><strong><b id="distance">—</b><em>m</em></strong></div><div><small>高度 H</small><strong><b id="altitude">60</b><em>m</em></strong></div><div><small>水平速度</small><strong><b id="speed">0.0</b><em>m/s</em></strong></div><div><small>航向</small><strong><b id="heading">000</b><em>°</em></strong></div><div><small>飞行时间</small><strong id="elapsed">00:00</strong></div></div><div class="flight-controls"><button id="play" class="primary" disabled>▶ 开始飞行</button><button id="pause" disabled>Ⅱ 暂停</button><button id="reset">↺ 新任务</button><span id="progress">0%</span></div></footer>
<div class="disclosure">飞行仿真 / 平面影像地表　© swisstopo</div><div id="toast" role="status"></div><script src="vendor/leaflet.js"></script><script src="vendor/three.min.js"></script><script src="core.js"></script><script src="mission.js"></script><script src="map.js"></script><script src="flight-view.js"></script><script src="cockpit.js"></script></body></html>
