<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N1 · 本机打卡照片</title>
<style>body{margin:28px auto;padding:0 20px;max-width:1120px;background:#14211f;color:#e2ece5;font:16px/1.6 system-ui}h1{font-size:24px}a{color:#b5ed98}#photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}article{padding:12px;border:1px solid #ffffff30;border-radius:8px}img{width:100%;display:block}p{margin:8px 0}small{overflow-wrap:anywhere;color:#afc3b7}</style>
<h1>N1 · 本机打卡照片</h1><p>仅显示此设备、此浏览器中保存成功的照片及对应任务记录。清除本站数据会删除这些照片。</p><p id="status" role="status">读取照片库…</p><section id="photos"></section>
<script src="photo-evidence.js?v=n1-checkin1"></script><script>
(async()=>{const box=document.getElementById('photos'),status=document.getElementById('status');try{const rows=await PhotoEvidence.list(),latest=new Map();for(const r of rows)if((latest.get(r.trialId)||'')<r.savedAt)latest.set(r.trialId,r.savedAt);rows.sort((a,b)=>a.trialId===b.trialId?(a.taskOrder&&b.taskOrder?a.taskOrder-b.taskOrder:a.capturedAt.localeCompare(b.capturedAt)):latest.get(b.trialId).localeCompare(latest.get(a.trialId)));status.textContent='已保存 '+rows.length+' 张照片';for(const row of rows){const card=document.createElement('article'),title=document.createElement('h2'),image=document.createElement('img'),info=document.createElement('p'),detail=document.createElement('small'),download=document.createElement('a'),url=URL.createObjectURL(row.image);title.textContent=row.checkpointName;image.src=url;image.alt=row.checkpointName;info.textContent='保存成功 · '+new Date(row.savedAt).toLocaleString();detail.textContent='任务 '+row.trialId+' · '+row.checkpointId;download.href=url;download.download=row.checkpointId+'.png';download.textContent='导出照片';card.append(title,image,info,detail,document.createElement('br'),download);box.append(card);}}catch(error){status.textContent='照片读取失败：'+error.message;}})();
</script></html>
